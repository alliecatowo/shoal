[package]
name = "shoal-installer"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
flate2 = "1.1.9"
libc = "0.2.186"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
toml = "1.0.6"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "shoal-install-transaction"
path = "src/main.rs"

[[bin]]
name = "shoal-release-inspect"
path = "src/bin/shoal-release-inspect.rs"
