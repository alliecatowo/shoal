[package]
name="shoal-secret"
version = "0.1.1"
edition="2024"
[dependencies]
aes-gcm="0.11"
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
zeroize="1"
serde={version="1",features=["derive"]}
serde_json="1"
base64 = "0.23"
tempfile="3"
[[bin]]
name="shoal-secret"
path="src/main.rs"
