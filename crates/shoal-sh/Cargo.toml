[lints]
workspace = true

[dependencies]
aes = { version = "0.9", features = ["zeroize"] }
aes-gcm = { version = "0.11", features = ["zeroize"] }
anyhow = "1"
base64 = "0.23"
blake3 = "1.8"
crossterm = "0.29"
csv = "1.4.0"
ctrlc = "3"
fd-lock = "4"
getrandom = "0.4"
glob = "0.3.3"
http = "1"
indexmap = { version = "2.14.0", features = ["serde"] }
jiff = "0.2.32"
libc = "0.2"
notify = "8.2.0"
nu-ansi-term = "0.50.3"
portable-pty = "0.9"
rand = "0.10"
reedline = { version = "0.52.0", features = ["external_printer"] }
regex = "1.13.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_norway = "0.9.42"
shell-words = "1.1.1"
signal-hook = "0.4"
strip-ansi-escapes = "0.2.1"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
toml = "1.1.2"
tower-lsp = "0.20"
unicode-segmentation = "1.12"
unicode-width = "0.2.2"
ureq = "3.3.0"
vt100 = "0.16.2"
wasmtime = { version = "49", default-features=false, features = ["component-model", "cranelift", "runtime", "wat"] }
zeroize = "1"
zstd = "0.14"

[target."cfg(target_os = \"linux\")".dependencies]
landlock = "0.4.5"

[dev-dependencies]
criterion = "0.8"
pretty_assertions = "1.4.1"
proptest = "1.7"
wasmprinter = "0.258"
wat = "1"
wit-component = { version = "0.258", features = ["dummy-module"] }
wit-parser = "0.258"
