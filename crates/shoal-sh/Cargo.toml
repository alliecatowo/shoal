[package]
name = "shoal-sh"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
description = "A typed, journaled, capability-leashed shell with first-class values, structured pipelines and an agent (MCP) kernel"
license.workspace = true
repository.workspace = true
homepage = "https://github.com/alliecatowo/shoal"
documentation = "https://docs.rs/shoal-sh"
readme = "../../README.md"
keywords = ["shell", "repl", "terminal", "structured-data", "sandbox"]
categories = ["command-line-utilities"]
autotests = false
autobenches = false
autobins = false
build = "build.rs"

[lib]
name = "shoal_sh"
path = "src/lib.rs"

[[bin]]
name = "shoal"
path = "src/main.rs"

[[bin]]
name = "shoal-doctor"
path = "src/bin/shoal-doctor.rs"

[[bin]]
name = "shoal-history"
path = "src/bin/shoal-history.rs"

[[bin]]
name = "shoal-kernel"
path = "src/bin/shoal-kernel.rs"

[[bin]]
name = "shoal-landlock-helper"
path = "src/bin/shoal-landlock-helper.rs"

[[bin]]
name = "shoal-lsp"
path = "src/bin/shoal-lsp.rs"

[[bin]]
name = "shoal-mcp"
path = "src/bin/shoal-mcp.rs"

[[bin]]
name = "shoal-sandbox-exec"
path = "src/bin/shoal-sandbox-exec.rs"

[[bin]]
name = "shoal-secret"
path = "src/bin/shoal-secret.rs"

[[bin]]
name = "shoal-token"
path = "src/bin/shoal-token.rs"

[[test]]
name = "adapters_adapter_fixtures"
