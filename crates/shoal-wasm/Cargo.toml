[package]
name="shoal-wasm"
version = "0.1.3"
edition="2024"

[lints]
workspace = true

[dependencies]
serde={version="1",features=["derive"]}
serde_json="1"
toml="1"
thiserror="2"
blake3="1"
shoal-leash={path="../shoal-leash"}
wasmtime={version="49",default-features=false,features=["component-model","cranelift","runtime","wat"]}
[dev-dependencies]
tempfile="3"
wit-component={version="0.258",features=["dummy-module"]}
wit-parser="0.258"
wasmprinter="0.258"
wat="1"
