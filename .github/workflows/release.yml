name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches workspace version
        shell: bash
        run: |
          pkg="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          [ "v$pkg" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$pkg" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build binaries
        run: cargo build --release --locked --workspace --bins --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          dist="shoal-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$dist"
          # Copy every non-example executable produced for this target.
          find "target/${{ matrix.target }}/release" -maxdepth 1 -type f -perm -u+x \
            ! -name '*.d' ! -name '*.rlib' ! -name '*.so' ! -name '*.dylib' \
            -exec cp {} "$dist/" \;
          cp README.md LICENSE* "$dist/" 2>/dev/null || true
          tar czf "$dist.tar.gz" "$dist"
          # sha256sum on Linux, shasum on macOS
          (sha256sum "$dist.tar.gz" 2>/dev/null || shasum -a 256 "$dist.tar.gz") > "$dist.tar.gz.sha256"
          echo "ASSET=$dist.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_SUM=$dist.tar.gz.sha256" >> "$GITHUB_ENV"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SUM }}
          generate_release_notes: true
