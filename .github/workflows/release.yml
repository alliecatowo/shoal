name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release must never ship a commit that main's CI has not passed. The tag is
  # normally pushed right after the release PR merges, so wait for CI to finish.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a green CI run on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status)"
          case "$status" in identical|behind) ;; *) echo "::error::tag commit is not on main ($status)"; exit 1 ;; esac
          for i in $(seq 1 80); do
            row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --json status,conclusion --jq '.[0] // empty | "\(.status) \(.conclusion)"')"
            echo "attempt $i: ${row:-no CI run yet}"
            case "$row" in
              "completed success") exit 0 ;;
              "completed "*) echo "::error::CI did not pass for $GITHUB_SHA ($row)"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::timed out waiting for CI on $GITHUB_SHA"; exit 1

  build:
    name: build ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Tag matches workspace version
        shell: bash
        run: |
          pkg="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          [ "v$pkg" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$pkg" >&2; exit 1; }
      # rust-toolchain.toml pins the channel, so install the target for that
      # toolchain (dtolnay@stable would add it to `stable`, which isn't used).
      - name: Install pinned toolchain and target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build binaries
        run: cargo build --release --locked --workspace --bins --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          dist="shoal-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$dist"
          # Copy every non-example executable produced for this target.
          find "target/${{ matrix.target }}/release" -maxdepth 1 -type f -perm -u+x \
            ! -name '*.d' ! -name '*.rlib' ! -name '*.so' ! -name '*.dylib' \
            -exec cp {} "$dist/" \;
          cp README.md LICENSE* "$dist/" 2>/dev/null || true
          cp -R man "$dist/man"
          # Shell completions come from the freshly built binary; skip only for the
          # cross-compiled target, whose binary cannot run on this runner.
          if [ "${{ matrix.target }}" != "aarch64-unknown-linux-gnu" ]; then
            mkdir -p "$dist/completions"
            bin="target/${{ matrix.target }}/release/shoal"
            "$bin" completions bash > "$dist/completions/shoal.bash"
            "$bin" completions zsh > "$dist/completions/_shoal"
            "$bin" completions fish > "$dist/completions/shoal.fish"
          fi
          tar czf "$dist.tar.gz" "$dist"
          # sha256sum on Linux, shasum on macOS
          (sha256sum "$dist.tar.gz" 2>/dev/null || shasum -a 256 "$dist.tar.gz") > "$dist.tar.gz.sha256"
          echo "ASSET=$dist.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_SUM=$dist.tar.gz.sha256" >> "$GITHUB_ENV"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      - name: Upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SUM }}
          generate_release_notes: true

  update-homebrew:
    name: Update Homebrew formula
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true  # a formula-bump hiccup must not fail the release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Render formula from the published checksums
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/shoal-${TAG}"
          sum() { curl -fsSL "${base}-$1.tar.gz.sha256" | awk '{print $1}'; }
          A_DARWIN="$(sum aarch64-apple-darwin)"
          X_DARWIN="$(sum x86_64-apple-darwin)"
          A_LINUX="$(sum aarch64-unknown-linux-gnu)"
          X_LINUX="$(sum x86_64-unknown-linux-gnu)"
          mkdir -p tap-out/Formula
          sed \
            -e "s|SHOAL_VERSION_PLAIN|${VERSION}|g" \
            -e "s|SHOAL_SHA256_AARCH64_DARWIN|${A_DARWIN}|g" \
            -e "s|SHOAL_SHA256_X86_64_DARWIN|${X_DARWIN}|g" \
            -e "s|SHOAL_SHA256_AARCH64_LINUX|${A_LINUX}|g" \
            -e "s|SHOAL_SHA256_X86_64_LINUX|${X_LINUX}|g" \
            packaging/homebrew/shoal.rb.tmpl > tap-out/Formula/shoal.rb
          grep -q SHOAL_ tap-out/Formula/shoal.rb && { echo "unrendered placeholder" >&2; exit 1; }
          cat tap-out/Formula/shoal.rb

      - name: Push formula to alliecatowo/homebrew-tap
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_DEPLOY_KEY:-}" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY secret is not set; cannot update the tap"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $keyfile -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone --depth 1 git@github.com:alliecatowo/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp tap-out/Formula/shoal.rb tap/Formula/shoal.rb
          cd tap
          if [ -z "$(git status --porcelain)" ]; then
            echo "Tap already up to date; nothing to push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/shoal.rb
          git commit -m "shoal ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main

  # crates.io trusted publishing (OIDC, no long-lived token). Requires a trusted publisher
  # configured on the crate (owner alliecatowo, repo shoal, workflow release.yml, environment
  # crates-io). crates.io cannot create a NEW crate via trusted publishing, so the very first
  # `cargo publish -p shoal-sh` must be done once by hand with a short-lived token.
  # continue-on-error: a missing/unconfigured publisher fails this job loudly but never blocks
  # the GitHub release binaries or the Homebrew update.
  publish-crate:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Authenticate to crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish shoal-sh
        run: cargo publish -p shoal-sh --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
