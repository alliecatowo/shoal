# Weekly version updates. Minor and patch bumps are grouped into one PR per ecosystem and
# auto-merged by .github/workflows/dependabot-automerge.yml once the required checks are green;
# major bumps arrive as separate PRs labelled `major-update` for a human.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
